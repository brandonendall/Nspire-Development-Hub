name: EndraHome Run014 - Transactional shortcut assignment save fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraHome/run014/**'
      - '.github/workflows/endrahome-run014.yml'
  pull_request:
    paths:
      - 'Projects/EndraHome/run014/**'
      - '.github/workflows/endrahome-run014.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test config transactional save, recovery and GUI
        run: |
          make -C Projects/EndraHome/run014 test
          make -C Projects/EndraHome/run014 preview
          test -s Projects/EndraHome/run014/build/home.ppm
          test -s Projects/EndraHome/run014/build/picker.ppm
          grep -Fq 'EndraHome_Apps.cfg.tns' Projects/EndraHome/run014/registry.h
          grep -Fq 'eh14_assign_save(' Projects/EndraHome/run014/main.c
          grep -Fq 'eh14_recover_config(' Projects/EndraHome/run014/main.c
          ! grep -Eq '^[[:space:]]*refresh_osscr\(' Projects/EndraHome/run014/platform.c Projects/EndraHome/run014/main.c
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run014_Previews
          path: Projects/EndraHome/run014/build/*.ppm
  native:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Build Ndless Run014 SaveFix
        run: |
          docker pull "$NSPIRE_BUILD_IMAGE"
          bash toolchain/build.sh Projects/EndraHome/run014
      - name: Verify native binary and checksum
        run: |
          cd Projects/EndraHome/run014
          test -s EndraHome_Run014_SaveFix.tns
          test -s EndraHome_Apps.cfg.tns
          sha256sum EndraHome_Run014_SaveFix.tns > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run014_SaveFix
          path: |
            Projects/EndraHome/run014/EndraHome_Run014_SaveFix.tns
            Projects/EndraHome/run014/EndraHome_Apps.cfg.tns
            Projects/EndraHome/run014/README.md
            Projects/EndraHome/run014/SHA256SUMS.txt
          if-no-files-found: error
