name: EndraHome Run001 - SDL Launcher
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraHome/**'
      - '.github/workflows/endrahome.yml'
  pull_request:
    paths:
      - 'Projects/EndraHome/**'
      - '.github/workflows/endrahome.yml'
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test safe shortcut parser
        run: make -C Projects/EndraHome test
  calculator-build:
    needs: host-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Compile SDL launcher
        run: |
          docker pull "$NSPIRE_BUILD_IMAGE"
          bash toolchain/build.sh Projects/EndraHome
      - name: Check native executable
        run: |
          test -s Projects/EndraHome/EndraHome_Run001.tns
          sha256sum Projects/EndraHome/EndraHome_Run001.tns > Projects/EndraHome/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run001
          path: |
            Projects/EndraHome/EndraHome_Run001.tns
            Projects/EndraHome/SHA256SUMS.txt
            Projects/EndraHome/shortcuts.example.cfg.tns
            Projects/EndraHome/README.md
          if-no-files-found: error
