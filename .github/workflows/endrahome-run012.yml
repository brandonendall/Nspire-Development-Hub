name: EndraHome Run012 - Quick launch with Menu info
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraHome/run012/**'
      - '.github/workflows/endrahome-run012.yml'
  pull_request:
    paths:
      - 'Projects/EndraHome/run012/**'
      - '.github/workflows/endrahome-run012.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test direct launch, info and return-home
        run: |
          make -C Projects/EndraHome/run012 test
          make -C Projects/EndraHome/run012 preview
          test -s Projects/EndraHome/run012/build/home.ppm
          test -s Projects/EndraHome/run012/build/info.ppm
          test -s Projects/EndraHome/run012/build/unconfigured.ppm
          grep -Fq 'EndraHome_Apps.cfg.tns' Projects/EndraHome/run012/registry.h
          grep -Fq 'eh11_resume_home(&ui)' Projects/EndraHome/run012/main.c
          ! grep -Eq '^[[:space:]]*refresh_osscr\(' Projects/EndraHome/run012/platform.c Projects/EndraHome/run012/main.c
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run012_Previews
          path: Projects/EndraHome/run012/build/*.ppm
  native:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Build native Run012
        run: |
          docker pull "$NSPIRE_BUILD_IMAGE"
          bash toolchain/build.sh Projects/EndraHome/run012
      - name: Verify TNS and checksum
        run: |
          cd Projects/EndraHome/run012
          test -s EndraHome_Run012_QuickLaunch.tns
          test -s EndraHome_Apps.cfg.tns
          sha256sum EndraHome_Run012_QuickLaunch.tns > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run012_QuickLaunch
          path: |
            Projects/EndraHome/run012/EndraHome_Run012_QuickLaunch.tns
            Projects/EndraHome/run012/EndraHome_Apps.cfg.tns
            Projects/EndraHome/run012/README.md
            Projects/EndraHome/run012/SHA256SUMS.txt
          if-no-files-found: error
