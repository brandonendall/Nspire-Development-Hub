name: EndraZIP 005 - Endra branding

on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraZIP/**'
      - 'toolchain/build.sh'
      - '.github/workflows/endrazip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Prepare vendored miniz header
        working-directory: Projects/EndraZIP
        run: sh get_miniz.sh
      - name: Test controls and ZIP round trips
        working-directory: Projects/EndraZIP
        run: python3 tests/test_host.py
      - name: Build EndraZIP with shared Ndless toolchain
        run: |
          docker pull "$NSPIRE_BUILD_IMAGE"
          bash toolchain/build.sh Projects/EndraZIP
      - name: Verify and package calculator binary
        run: |
          test -s Projects/EndraZIP/EndraZIP_005.tns
          mkdir -p dist
          cp Projects/EndraZIP/EndraZIP_005.tns dist/
          cp Projects/EndraZIP/README.md dist/
          cd dist
          sha256sum EndraZIP_005.tns > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EndraZIP_005
          path: dist/
          if-no-files-found: error

