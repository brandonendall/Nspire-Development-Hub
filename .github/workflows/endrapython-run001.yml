name: EndraPython Run031
on:
  push:
    branches: [feature/endrapython-run001]
    paths: ['Projects/EndraPython/**', '.github/workflows/endrapython-run001.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned MicroPython core
        working-directory: Projects/EndraPython
        run: sh prepare.sh
      - name: Exercise the editor and interpreter
        working-directory: Projects/EndraPython
        run: |
          make -j2 check
          python3 -m pip install Pillow
          python3 tests/previews.py
      - name: Build with the pinned Ndless SDK
        run: bash toolchain/build.sh Projects/EndraPython
      - name: Verify and package
        working-directory: Projects/EndraPython
        run: |
          test "$(head -c4 EndraPython_Run031.tns)" = Zehn
          readelf -h build/endrapython.elf | grep -E 'Machine: +ARM'
          sha256sum EndraPython_Run031.tns > build/SHA256SUMS.txt
          wc -c EndraPython_Run031.tns
          cat build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EndraPython_Run031
          if-no-files-found: error
          path: |
            Projects/EndraPython/EndraPython_Run031.tns
            Projects/EndraPython/build/SHA256SUMS.txt
            Projects/EndraPython/build/previews/
            Projects/EndraPython/licenses/
            Projects/EndraPython/tests/Run012_Graphics_Test.py.tns
            Projects/EndraPython/tests/Run012_Frame_Probe.py.tns
            Projects/EndraPython/tests/Run013_Numerics_Test.py.tns
            Projects/EndraPython/tests/Run014_Pygame_Test.py.tns
            Projects/EndraPython/tests/Run015_Assets_Test.py.tns
            Projects/EndraPython/tests/Run021_Gint_Drawing.py.tns
            Projects/EndraPython/tests/Run022_Gint_Keys.py.tns
            Projects/EndraPython/tests/Run023_Pygame_Draw.py.tns
            Projects/EndraPython/tests/Run024_Pygame_Events.py.tns
            Projects/EndraPython/tests/Run025_Pygame_Vectors.py.tns
            Projects/EndraPython/tests/Run026_Py3D_Cube.py.tns
            Projects/EndraPython/tests/Run027_Py3D_Profile.py.tns
            Projects/EndraPython/tests/Run028_Py3D_Clipping.py.tns
            Projects/EndraPython/tests/Run029_Py3D_Benchmark.py.tns
            Projects/EndraPython/tests/Run030_Py3D_Depth.py.tns
            Projects/EndraPython/tests/Run031_Py3D_Modes.py.tns
            Projects/EndraPython/build/Run015_Badge.bmp.tns
      - name: Offer the standalone calculator download
        uses: actions/upload-artifact@v7
        with:
          path: Projects/EndraPython/EndraPython_Run031.tns
          archive: false
          if-no-files-found: error
