name: EndraHome Run007 - ZIP only application launcher test
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraHome/run007/**'
      - 'Projects/EndraHome/run006/render.c'
      - 'Projects/EndraHome/run006/target.c'
      - 'Projects/EndraHome/gba-ui/platform.c'
      - 'Projects/EndraHome/run005/logic7.c'
      - '.github/workflows/endrahome-zip007.yml'
  pull_request:
    paths:
      - 'Projects/EndraHome/run007/**'
      - 'Projects/EndraHome/run006/render.c'
      - 'Projects/EndraHome/run006/target.c'
      - 'Projects/EndraHome/gba-ui/platform.c'
      - 'Projects/EndraHome/run005/logic7.c'
      - '.github/workflows/endrahome-zip007.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test permitted launch targets and create previews
        run: |
          make -C Projects/EndraHome/run007 test
          make -C Projects/EndraHome/run007 preview
          test -s Projects/EndraHome/run007/build/zip-confirm.ppm
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run007_Previews
          path: Projects/EndraHome/run007/build/*.ppm
  native:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Build the launcher with the unchanged Run003 platform
        run: |
          docker pull "$NSPIRE_BUILD_IMAGE"
          bash toolchain/build.sh Projects/EndraHome/run007
      - name: Verify two native executables and hash them
        run: |
          cd Projects/EndraHome/run007
          test -s EndraHome_Run007_ZIPLauncher.tns
          test -s EndraHome_Test006.tns
          sha256sum EndraHome_Run007_ZIPLauncher.tns EndraHome_Test006.tns > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run007_ZIPLauncher
          path: |
            Projects/EndraHome/run007/EndraHome_Run007_ZIPLauncher.tns
            Projects/EndraHome/run007/EndraHome_Test006.tns
            Projects/EndraHome/run007/README.md
            Projects/EndraHome/run007/SHA256SUMS.txt
          if-no-files-found: error
