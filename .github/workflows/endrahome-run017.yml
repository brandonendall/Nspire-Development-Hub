name: EndraHome Run017 - Built-In Files
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraHome/run017/**'
      - '.github/workflows/endrahome-run017.yml'
  pull_request:
    paths:
      - 'Projects/EndraHome/run017/**'
      - '.github/workflows/endrahome-run017.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test browser, preview, no writes and launcher regression
        run: |
          make -C Projects/EndraHome/run017 test
          make -C Projects/EndraHome/run017 preview
          for p in home manager rename settings picker files; do test -s "Projects/EndraHome/run017/build/$p.ppm"; done
          grep -Fq 'EndraHome_Apps.cfg.tns' Projects/EndraHome/run017/registry.h
          grep -Fq 'eh17_files_open(&built_files' Projects/EndraHome/run017/main.c
          grep -Fq 'eh11_resume_home(&ui)' Projects/EndraHome/run017/main.c
          ! grep -Eq '^[[:space:]]*refresh_osscr\(' Projects/EndraHome/run017/platform.c Projects/EndraHome/run017/main.c
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run017_Previews
          path: Projects/EndraHome/run017/build/*.ppm
  native:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Build Ndless Run017 native Files
        run: |
          docker pull "$NSPIRE_BUILD_IMAGE"
          bash toolchain/build.sh Projects/EndraHome/run017
      - name: Verify .tns and checksum
        run: |
          cd Projects/EndraHome/run017
          test -s EndraHome_Run017_BuiltInFiles.tns
          test -s EndraHome_Apps.cfg.tns
          sha256sum EndraHome_Run017_BuiltInFiles.tns > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run017_BuiltInFiles
          path: |
            Projects/EndraHome/run017/EndraHome_Run017_BuiltInFiles.tns
            Projects/EndraHome/run017/EndraHome_Apps.cfg.tns
            Projects/EndraHome/run017/README.md
            Projects/EndraHome/run017/SHA256SUMS.txt
          if-no-files-found: error
