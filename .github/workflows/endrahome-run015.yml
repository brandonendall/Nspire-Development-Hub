name: EndraHome Run015 - App Manager
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraHome/run015/**'
      - '.github/workflows/endrahome-run015.yml'
  pull_request:
    paths:
      - 'Projects/EndraHome/run015/**'
      - '.github/workflows/endrahome-run015.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check manager, safe config persistence and previews
        run: |
          make -C Projects/EndraHome/run015 test
          make -C Projects/EndraHome/run015 preview
          for p in home manager rename settings picker; do test -s "Projects/EndraHome/run015/build/$p.ppm"; done
          grep -Fq 'EndraHome_Apps.cfg.tns' Projects/EndraHome/run015/registry.h
          grep -Fq 'eh11_resume_home(&ui)' Projects/EndraHome/run015/main.c
          ! grep -Eq '^[[:space:]]*refresh_osscr\(' Projects/EndraHome/run015/platform.c Projects/EndraHome/run015/main.c
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run015_Previews
          path: Projects/EndraHome/run015/build/*.ppm
  native:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Build native App Manager
        run: |
          docker pull "$NSPIRE_BUILD_IMAGE"
          bash toolchain/build.sh Projects/EndraHome/run015
      - name: Verify .tns and checksum
        run: |
          cd Projects/EndraHome/run015
          test -s EndraHome_Run015_AppManager.tns
          test -s EndraHome_Apps.cfg.tns
          sha256sum EndraHome_Run015_AppManager.tns > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run015_AppManager
          path: |
            Projects/EndraHome/run015/EndraHome_Run015_AppManager.tns
            Projects/EndraHome/run015/EndraHome_Apps.cfg.tns
            Projects/EndraHome/run015/README.md
            Projects/EndraHome/run015/SHA256SUMS.txt
          if-no-files-found: error
