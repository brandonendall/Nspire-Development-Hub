name: EndraDiagnostics Run002 - Exit Safety Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraDiagnostics/run002/**'
      - '.github/workflows/endradiagnostics-run002.yml'
  pull_request:
    paths:
      - 'Projects/EndraDiagnostics/run002/**'
      - '.github/workflows/endradiagnostics-run002.yml'
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Build with preserved Run003 graphics and input
        run: |
          set -euxo pipefail
          docker pull "$NSPIRE_BUILD_IMAGE"
          docker run --rm --entrypoint /bin/sh \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work "$NSPIRE_BUILD_IMAGE" \
            -c 'set -eu; make -C Projects/EndraDiagnostics/run002 clean all'
      - name: Verify executable and checksum
        run: |
          set -euxo pipefail
          test -s Projects/EndraDiagnostics/run002/EndraDiagnostics_Run002.tns
          sha256sum Projects/EndraDiagnostics/run002/EndraDiagnostics_Run002.tns
      - uses: actions/upload-artifact@v4
        with:
          name: EndraDiagnostics_Run002_tns
          path: Projects/EndraDiagnostics/run002/EndraDiagnostics_Run002.tns
          if-no-files-found: error
