name: EndraHome Run022 - Safe Rename and Folder Creation
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraHome/run022/**'
      - '.github/workflows/endrahome-run022.yml'
  pull_request:
    paths:
      - 'Projects/EndraHome/run022/**'
      - '.github/workflows/endrahome-run022.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Host tests — real JPEG decode, zoom/pan, safe Files and quick launch
        run: |
          make -C Projects/EndraHome/run022 test
          make -C Projects/EndraHome/run022 preview
          for p in home manager rename settings picker files; do test -s "Projects/EndraHome/run022/build/$p.ppm"; done
          grep -Fq 'EndraHome_Apps.cfg.tns' Projects/EndraHome/run022/registry.h
          grep -Fq 'eh18_zoomkey()' Projects/EndraHome/run022/main.c
          grep -Fq 'eh11_resume_home(&ui)' Projects/EndraHome/run022/main.c
          ! grep -Eq '^[[:space:]]*refresh_osscr\(' Projects/EndraHome/run022/platform.c Projects/EndraHome/run022/main.c
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run022_Previews
          path: Projects/EndraHome/run022/build/*.ppm
  native:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Native CX II CAS Ndless JPEG/PNG build
        run: |
          docker pull "$NSPIRE_BUILD_IMAGE"
          bash toolchain/build.sh Projects/EndraHome/run022
      - name: Verify output and checksum
        run: |
          cd Projects/EndraHome/run022
          test -s EndraHome_Run022_Themes.tns
          test -s EndraHome_Apps.cfg.tns
          sha256sum EndraHome_Run022_Themes.tns > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run022_Themes
          path: |
            Projects/EndraHome/run022/EndraHome_Run022_Themes.tns
            Projects/EndraHome/run022/EndraHome_Apps.cfg.tns
            Projects/EndraHome/run022/README.md
            Projects/EndraHome/run022/SHA256SUMS.txt
          if-no-files-found: error
