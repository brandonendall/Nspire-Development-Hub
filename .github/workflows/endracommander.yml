name: EndraCommander NX Run004 - freeze-trace and write lock

on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraCommander/**'
      - '.github/workflows/endracommander.yml'

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run original filesystem and ZIP checks with sanitizers
        working-directory: Projects/EndraCommander
        run: |\n          make test\n          make preview
  calculator-build:
    needs: host-checks
    runs-on: ubuntu-latest
    container: debian:13-slim
    timeout-minutes: 30
    steps:
      - name: Install compiler and SDK build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential php-cli \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev \
            libboost-program-options-dev zlib1g-dev
      - uses: actions/checkout@v4
      - name: Build pinned Ndless SDK and Endra Run004 application
        working-directory: Projects/EndraCommander
        run: bash scripts/build-sdk.sh
      - name: Verify and package calculator binary
        working-directory: Projects/EndraCommander
        run: |
          test -s dist/EndraCommanderNX_Run004.tns
          cp README.md QUICK_START.txt.tns THIRD_PARTY.md dist/
          cd dist
          sha256sum EndraCommanderNX_Run004.tns > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EndraCommanderNX_Run004
          path: Projects/EndraCommander/dist/
          if-no-files-found: error
