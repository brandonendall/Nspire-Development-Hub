name: Preserve original UltraGBA Git history bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-legacy-ultragba-history.yml'

permissions:
  contents: write

jobs:
  archive-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clone original history and validate Run007 head
        run: |
          set -euo pipefail
          git clone --bare https://github.com/OffCamera-Civilman/Nspire-Development-Hub.git legacy.git
          test "$(git --git-dir legacy.git rev-parse refs/heads/ultragba-run007-browser-launch-cleanup)" = "e151b2ccb245f67b62ec8f20b9a2a51c4e55bc1f"
      - name: Archive the complete original branch history in a portable Git bundle
        run: |
          set -euo pipefail
          mkdir -p handoff/history
          git --git-dir legacy.git bundle create "$GITHUB_WORKSPACE/handoff/history/UltraGBA-all-repo-branches.bundle" --all
          git --git-dir legacy.git bundle verify "$GITHUB_WORKSPACE/handoff/history/UltraGBA-all-repo-branches.bundle"
          git bundle list-heads handoff/history/UltraGBA-all-repo-branches.bundle > handoff/history/BRANCH-HEADS.txt
          sha256sum handoff/history/UltraGBA-all-repo-branches.bundle > handoff/history/SHA256SUMS.txt
      - name: Commit archive only (never change application or workflow files)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handoff/history/UltraGBA-all-repo-branches.bundle handoff/history/BRANCH-HEADS.txt handoff/history/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified original UltraGBA Git history bundle"
            git push origin HEAD:main
          fi
