name: Restore legacy UltraGBA Git history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-legacy-ultragba-history.yml'

permissions:
  contents: write

jobs:
  mirror-legacy-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone read-only original history and verify handoff head
        run: |
          set -euo pipefail
          git clone --bare https://github.com/OffCamera-Civilman/Nspire-Development-Hub.git legacy.git
          test "$(git --git-dir legacy.git rev-parse refs/heads/ultragba-run007-browser-launch-cleanup)" = "e151b2ccb245f67b62ec8f20b9a2a51c4e55bc1f"
      - name: Import historical branches without modifying main or existing branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for branch in \
            main \
            feature/ultragba-run001 \
            fix/ndless-run001-sdk \
            ultragba-run002-baseline \
            ultragba-run003-compressed-saves \
            ultragba-run004-rtc-layout \
            ultragba-run005-rtc-persistence-launch \
            ultragba-run006-rom-associations \
            ultragba-run007-browser-launch-cleanup
          do
            git --git-dir legacy.git rev-parse --verify "refs/heads/${branch}"
            if [ "$branch" = main ]; then
              dest="legacy/original-main"
            else
              dest="legacy/${branch}"
            fi
            git --git-dir legacy.git push "$REMOTE" "refs/heads/${branch}:refs/heads/${dest}"
          done
      - name: Confirm local original branch list
        run: git --git-dir legacy.git branch --list
