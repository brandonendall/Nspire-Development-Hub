name: EndraDiagnostics Run003 - Keypad Exit Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraDiagnostics/run003/**'
      - 'Projects/EndraDiagnostics/run002/platform.*'
      - 'Projects/EndraDiagnostics/run002/logic.h'
      - '.github/workflows/endradiagnostics-run003.yml'
  pull_request:
    paths:
      - 'Projects/EndraDiagnostics/run003/**'
      - '.github/workflows/endradiagnostics-run003.yml'
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Build native .tns
        run: |
          set -euxo pipefail
          docker pull "$NSPIRE_BUILD_IMAGE"
          docker run --rm --entrypoint /bin/sh \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work "$NSPIRE_BUILD_IMAGE" \
            -c 'set -eu; make -C Projects/EndraDiagnostics/run003 clean all'
      - name: Verify compiled output
        run: |
          test -s Projects/EndraDiagnostics/run003/EndraDiagnostics_Run003.tns
          sha256sum Projects/EndraDiagnostics/run003/EndraDiagnostics_Run003.tns
      - uses: actions/upload-artifact@v4
        with:
          name: EndraDiagnostics_Run003_tns
          path: Projects/EndraDiagnostics/run003/EndraDiagnostics_Run003.tns
          if-no-files-found: error
