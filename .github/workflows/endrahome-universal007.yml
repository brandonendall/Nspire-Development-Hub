name: EndraHome Run007 - Universal configurable launcher
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraHome/run007/**'
      - 'Projects/EndraHome/run005/logic7.c'
      - 'Projects/EndraHome/gba-ui/platform.c'
      - '.github/workflows/endrahome-universal007.yml'
  pull_request:
    paths:
      - 'Projects/EndraHome/run007/**'
      - 'Projects/EndraHome/run005/logic7.c'
      - 'Projects/EndraHome/gba-ui/platform.c'
      - '.github/workflows/endrahome-universal007.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate input, seven app paths, and native-sized previews
        run: |
          make -C Projects/EndraHome/run007 test
          make -C Projects/EndraHome/run007 preview
          test -s Projects/EndraHome/run007/build/home.ppm
          test -s Projects/EndraHome/run007/build/confirm.ppm
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run007_Universal_Previews
          path: Projects/EndraHome/run007/build/*.ppm
  native:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Build configurable Ndless launcher
        run: |
          docker pull "$NSPIRE_BUILD_IMAGE"
          bash toolchain/build.sh Projects/EndraHome/run007
      - name: Validate deliverables
        run: |
          cd Projects/EndraHome/run007
          test -s EndraHome_Run007_Universal.tns
          test -s EndraHome_Apps007.cfg.tns
          sha256sum EndraHome_Run007_Universal.tns > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run007_Universal
          path: |
            Projects/EndraHome/run007/EndraHome_Run007_Universal.tns
            Projects/EndraHome/run007/EndraHome_Apps007.cfg.tns
            Projects/EndraHome/run007/SHA256SUMS.txt
            Projects/EndraHome/run007/README.md
          if-no-files-found: error
