name: EndraDiagnostics Run012 - Eight Page Dashboard
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraDiagnostics/run012/**'
      - '.github/workflows/endradiagnostics-run012.yml'
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Validate no automatic exit and no unsafe writes
        run: |
          set -euo pipefail
          grep -F '#define PAGES 8u' Projects/EndraDiagnostics/run012/main.c
          grep -F 'for(uint32_t loop=0;;loop++)' Projects/EndraDiagnostics/run012/main.c
          grep -F 'eh_platform_stop_mode(0)' Projects/EndraDiagnostics/run012/main.c
          ! grep -E 'MAX_STEPS|auto_exit|refresh_osscr\(' Projects/EndraDiagnostics/run012/main.c
          cmp Projects/EndraDiagnostics/run011/platform.c Projects/EndraDiagnostics/run012/platform.c
      - name: Build real native Ndless TNS
        run: |
          set -euxo pipefail
          docker pull "$NSPIRE_BUILD_IMAGE"
          docker run --rm --entrypoint /bin/sh \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work "$NSPIRE_BUILD_IMAGE" \
            -c 'set -eu; make -C Projects/EndraDiagnostics/run012 clean all'
      - name: Verify binary
        run: |
          test -s Projects/EndraDiagnostics/run012/EndraDiagnostics_Run012.tns
          sha256sum Projects/EndraDiagnostics/run012/EndraDiagnostics_Run012.tns
      - uses: actions/upload-artifact@v4
        with:
          name: EndraDiagnostics_Run012_tns
          path: Projects/EndraDiagnostics/run012/EndraDiagnostics_Run012.tns
          if-no-files-found: error
