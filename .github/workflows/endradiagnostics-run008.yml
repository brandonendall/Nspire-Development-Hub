name: EndraDiagnostics Run008 - Unified Fast Exit
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraDiagnostics/run008/**'
      - '.github/workflows/endradiagnostics-run008.yml'
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Compile Run008 native Ndless
        run: |
          set -euxo pipefail
          docker pull "$NSPIRE_BUILD_IMAGE"
          docker run --rm --entrypoint /bin/sh \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work "$NSPIRE_BUILD_IMAGE" \
            -c 'set -eu; make -C Projects/EndraDiagnostics/run008 clean all'
      - name: Verify genuine TNS output
        run: |
          test -s Projects/EndraDiagnostics/run008/EndraDiagnostics_Run008.tns
          sha256sum Projects/EndraDiagnostics/run008/EndraDiagnostics_Run008.tns
      - uses: actions/upload-artifact@v4
        with:
          name: EndraDiagnostics_Run008_tns
          path: Projects/EndraDiagnostics/run008/EndraDiagnostics_Run008.tns
          if-no-files-found: error
