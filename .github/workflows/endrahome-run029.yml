name: EndraHome Run031 - Desktop
# Manual-only release build: source commits do not launch overlapping CI runs.
on:
  workflow_dispatch:
concurrency:
  group: endrahome-run031-single-build
  cancel-in-progress: true
permissions:
  contents: read
  issues: write
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Host tests and launcher previews
        run: |
          make -C Projects/EndraHome/run029 test
          make -C Projects/EndraHome/run029 preview
          for p in home manager rename settings picker files; do test -s "Projects/EndraHome/run029/build/$p.ppm"; done
          grep -Fq 'EndraHome_Apps.cfg.tns' Projects/EndraHome/run029/registry.h
          grep -Fq 'eh18_zoomkey()' Projects/EndraHome/run029/main.c
          grep -Fq 'eh_return_from_launch(&ui,result)' Projects/EndraHome/run029/main.c
          ! grep -Eq '^[[:space:]]*refresh_osscr\(' Projects/EndraHome/run029/platform.c Projects/EndraHome/run029/main.c
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run031_Previews
          path: Projects/EndraHome/run029/build/*.ppm
  native:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Native CX II CAS Ndless JPEG/PNG build
        run: |
          docker pull "$NSPIRE_BUILD_IMAGE"
          bash toolchain/build.sh Projects/EndraHome/run029
      - name: Verify output and checksum
        run: |
          cd Projects/EndraHome/run029
          test -s EndraHome_Run031_Desktop.tns
          test -s EndraHome_Apps.cfg.tns
          test "$(head -c 4 EndraHome_Run031_Desktop.tns)" = Zehn
          sha256sum EndraHome_Run031_Desktop.tns > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EndraHome_Run031_Desktop
          path: |
            Projects/EndraHome/run029/EndraHome_Run031_Desktop.tns
            Projects/EndraHome/run029/README.md
            Projects/EndraHome/run029/SHA256SUMS.txt
          if-no-files-found: error

  report:
    name: Publish searchable build status
    if: ${{ always() }}
    needs: [host, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Update EndraHome latest-build issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HOST_RESULT: ${{ needs.host.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cat > /tmp/endrahome-status.md <<EOF
          # EndraHome — Latest Build Status

          **Run:** $RUN_URL
          **Workflow run number:** $RUN_NUMBER
          **Branch:** $BRANCH
          **Commit:** $SHA
          **Host tests:** $HOST_RESULT
          **Native Ndless build:** $NATIVE_RESULT

          **Artifact if native succeeded:** EndraHome_Run031_Desktop
          Download it from the run's **Artifacts** section.

          **Troubleshooting:** Open the run link, select the failed job, then inspect its log. The issue is automatically updated after each run, including failures. A green report job alone does not mean the native build passed.
          EOF
          gh issue edit 44 --body-file /tmp/endrahome-status.md
