name: EndraDiagnostics Run014 - Expanded Inspection
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/EndraDiagnostics/run014/**'
      - '.github/workflows/endradiagnostics-run014.yml'
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NSPIRE_BUILD_IMAGE: bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe platform reuse and manual-exit invariants
        run: |
          set -euo pipefail
          cmp Projects/EndraDiagnostics/run013/platform.c Projects/EndraDiagnostics/run014/platform.c
          grep -F '#define PAGES 14u' Projects/EndraDiagnostics/run014/main.c
          grep -F 'for(uint32_t loop=0;;loop++)' Projects/EndraDiagnostics/run014/main.c
          grep -F 'eh_platform_stop_mode(0)' Projects/EndraDiagnostics/run014/main.c
          grep -F 'const size_t size=4096;' Projects/EndraDiagnostics/run014/main.c
          ! grep -E 'MAX_STEPS|auto_exit|refresh_osscr\(' Projects/EndraDiagnostics/run014/main.c
      - name: Compile genuine native Ndless binary
        run: |
          set -euxo pipefail
          docker pull "$NSPIRE_BUILD_IMAGE"
          docker run --rm --entrypoint /bin/sh \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work "$NSPIRE_BUILD_IMAGE" \
            -c 'set -eu; make -C Projects/EndraDiagnostics/run014 clean all'
      - name: Verify TNS output
        run: |
          test -s Projects/EndraDiagnostics/run014/EndraDiagnostics_Run014.tns
          sha256sum Projects/EndraDiagnostics/run014/EndraDiagnostics_Run014.tns
      - uses: actions/upload-artifact@v4
        with:
          name: EndraDiagnostics_Run014_tns
          path: Projects/EndraDiagnostics/run014/EndraDiagnostics_Run014.tns
          if-no-files-found: error
